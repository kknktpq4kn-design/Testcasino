                if (m >= crashPoint) { state.mult = crashPoint; state.playing = false; state.crashed = true; updateUI(); } 
                else { state.mult = m; updateUI(); animReq = requestAnimationFrame(loop); }
            };
            const ghostLoop = (time) => {
                const elapsed = time - startTime; const m = 1 + (elapsed / 3000) * (elapsed / 2000);

                }
            };
        }

        // --- KENO ---
        function initKenoGame(container) {
            let state = { bet: 10, selected: [], drawn: [], playing: false, lastWin: 0 };
            const maxSelect = 10; const payouts = [0, 0, 0, 0, 1.5, 3, 10, 50, 200, 1000, 5000];

            container.innerHTML = `

                </div>
                <div class="flex-1 bg-[#0f212e] rounded-xl border border-[#2f4553] flex flex-col items-center justify-center p-4 lg:p-8 relative">
                    <div id="keno-grid" class="grid grid-cols-8 gap-1.5 lg:gap-2 w-full max-w-lg"></div>
                </div>
            </div>`;

            bindBetInput('keno', state);
            const btn = document.getElementById('keno-btn'); const countEl = document.getElementById('keno-count'); const gridEl = document.getElementById('keno-grid');

            const renderGrid = () => {
                gridEl.innerHTML = Array.from({length: 40}, (_, i) => i + 1).map(num => {
                    const isSelected = state.selected.includes(num); const isDrawn = state.drawn.includes(num); const isHit = isSelected && isDrawn;
                    let baseStyle = "bg-[#1a2c38] text-gray-400 hover:bg-[#2f4553] border border-[#2f4553]";
                    if (isHit) baseStyle = "bg-yellow-500 text-black font-black border-yellow-400 shadow-[0_0_10px_#eab308] scale-105 z-10"; else if (isSelected) baseStyle = "bg-purple-600 text-white font-bold border-purple-500"; else if (isDrawn) baseStyle = "bg-[#00e701] text-black font-bold border-[#00e701]";
                    return `<button data-num="${num}" class="keno-cell aspect-square rounded-md flex items-center justify-center text-sm lg:text-lg transition-all duration-200 cursor-pointer ${baseStyle}">${num}</button>`;
                }).join('');
                document.querySelectorAll('.keno-cell').forEach(cell => { cell.onclick = () => { if (state.playing) return; const num = parseInt(cell.dataset.num); if (state.selected.includes(num)) state.selected = state.selected.filter(n => n !== num); else if (state.selected.length < maxSelect) state.selected.push(num); countEl.innerText = `${state.selected.length} / ${maxSelect}`; renderGrid(); }; });
            };

            document.getElementById('keno-auto').onclick = () => { if (state.playing) return; state.selected = []; while(state.selected.length < maxSelect) { let r = Math.floor(Math.random() * 40) + 1; if(!state.selected.includes(r)) state.selected.push(r); } countEl.innerText = `${state.selected.length} / ${maxSelect}`; renderGrid(); };
            document.getElementById('keno-clear').onclick = () => { if (state.playing) return; state.selected = []; countEl.innerText = `0 / ${maxSelect}`; renderGrid(); };

            btn.onclick = async () => {
                if (state.bet <= 0 || state.bet > window.balance || state.playing || state.selected.length === 0) return;
                window.updateBalance(-state.bet); state.playing = true; state.drawn = []; state.lastWin = 0;
                btn.innerText = 'Calculating...'; btn.disabled = true; btn.classList.add('bg-gray-600'); btn.classList.remove('bg-[#00e701]', 'hover:bg-[#00c701]');
                
                // API CALL AL WORKER CLOUDFLARE
                const res = await window.fetchEngine('keno', { selected: state.selected });
                if(!res.success) { state.playing=false; btn.disabled=false; btn.innerText='Bet'; return; }
                const serverDrawn = res.data.drawn;

                renderGrid();
                let idx = 0;
                let drawInterval = setInterval(() => {
                    state.drawn.push(serverDrawn[idx]); renderGrid(); idx++;
                    if (idx >= 10) { clearInterval(drawInterval); finishGame(); }
                }, 150);
            };

            const finishGame = () => {
                const hits = state.selected.filter(n => state.drawn.includes(n)).length; let mult = 0;
                if (state.selected.length === 10) mult = payouts[hits];
                else if (state.selected.length > 0) { const hitRatio = hits / state.selected.length; if (hitRatio === 1) mult = state.selected.length * 2; else if (hitRatio > 0.5) mult = 1.5; }
                
                const winAmount = state.bet * mult;
                setTimeout(() => {
                    if (winAmount > 0) { window.updateBalance(winAmount); window.showWin(winAmount, mult); }
                    state.playing = false; btn.innerText = 'Bet'; btn.disabled = false; btn.classList.remove('bg-gray-600'); btn.classList.add('bg-[#00e701]', 'hover:bg-[#00c701]');
                }, 500);
            };
            renderGrid();
        }

        // ==========================================
        // 7. ESM BOOTSTRAPPER & AUTO-LOGIN
        // ==========================================
        async function bootBase44() {
            try {
                const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
                window.supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
                console.log("Supabase connected via ESM.");

                const savedSession = localStorage.getItem('nexusSession');
                if (savedSession) {
                    window.currentUser = JSON.parse(savedSession);
                    const { data } = await window.supabase.from('profiles').select('Balance, balance').eq('id', window.currentUser.id).single();
                    if (data) {
                        const dbBal = data.Balance !== undefined ? data.Balance : (data.balance !== undefined ? data.balance : 0);
                        window.updateBalance(Number(dbBal), true, true); 
                    }
                }
                window.initApp();

            } catch (err) {
                console.error("Critical Boot Error:", err);
                document.getElementById('app').innerHTML = `
                    <div class="flex flex-col items-center justify-center w-full h-full p-8 text-center"><i data-lucide="alert-triangle" class="w-16 h-16 text-red-500 mb-4"></i><h1 class="text-2xl font-bold text-white mb-2">SYSTEM FAILURE</h1><p class="text-red-400 max-w-md">Failed to load Base44 Engine. Disable aggressive adblockers to access NexusBet.</p></div>
                `;
                window.refreshIcons();
            }
        }
        bootBase44();
    </script>
