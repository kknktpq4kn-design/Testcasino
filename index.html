<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #2f4553; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #557086; }
        
        /* Slot Animation */
        @keyframes slotSpin {
          0% { transform: translateY(0); }
          100% { transform: translateY(-100%); }
        }
        .slot-spinning { animation: slotSpin 0.25s linear infinite; }

        /* Coin Flip 3D */
        .coin-inner {
            transform-style: preserve-3d;
            transition: transform 2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .coin-front, .coin-back {
            backface-visibility: hidden;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }
        .coin-back { transform: rotateY(180deg); }

        /* General Utilities */
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-[#0f212e] text-white font-sans overflow-hidden">

    <!-- APP CONTAINER -->
    <div id="app" class="w-full h-screen flex items-center justify-center">
        <!-- Loader iniziale visibile prima che il JS parta -->
        <div class="text-[#00e701] font-bold text-xl animate-pulse">Base44 Engine Loading...</div>
    </div>

    <script>
        // ==========================================
        // 1. GLOBALS & CONFIG
        // ==========================================
        const SUPABASE_URL = 'https://wjlpinbtsgebejrswdpx.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_j5elubk29slrbxZ7SGbHkw_KQ2AmFME';
        
        let supabase = null;
        let currentUser = null;
        let balance = 0;
        let currentTab = 'home';
        let sidebarOpen = window.innerWidth >= 1024;
        let syncTimeout = null;

        // ==========================================
        // 2. CORE FUNCTIONS
        // ==========================================
        function updateBalance(amount, isAbsolute = false) {
            if (isAbsolute) {
                balance = amount;
            } else {
                balance += amount;
            }
            
            const balanceDisplays = document.querySelectorAll('.wallet-balance');
            balanceDisplays.forEach(el => el.innerText = `$ ${balance.toFixed(2)}`);

            if (currentUser && supabase) {
                clearTimeout(syncTimeout);
                syncTimeout = setTimeout(async () => {
                    console.log("Syncing balance to DB...", balance);
                    try {
                        await supabase.from('profiles').update({ Balance: balance }).eq('id', currentUser.id);
                    } catch(e) { console.error("Sync error", e); }
                }, 1000);
            }
        }

        function refreshIcons() {
            if (window.lucide) window.lucide.createIcons();
        }

        function initApp() {
            const app = document.getElementById('app');
            if (!currentUser) {
                app.innerHTML = renderLoginView();
                bindLoginEvents();
            } else {
                app.innerHTML = renderCasinoLayout();
                navigate('home');
                bindLayoutEvents();
            }
            refreshIcons();
        }

        function navigate(tab) {
            currentTab = tab;
            const container = document.getElementById('main-content');
            
            document.querySelectorAll('.sidebar-item').forEach(el => {
                if (el.dataset.tab === tab) {
                    el.classList.add('bg-[#2f4553]', 'text-white');
                    el.classList.remove('text-gray-400');
                    const icon = el.querySelector('i');
                    if(icon) icon.classList.add('text-[#00e701]');
                } else {
                    el.classList.remove('bg-[#2f4553]', 'text-white');
                    el.classList.add('text-gray-400');
                    const icon = el.querySelector('i');
                    if(icon) icon.classList.remove('text-[#00e701]');
                }
            });

            if (window.innerWidth < 1024) toggleSidebar(false);

            switch(tab) {
                case 'home': renderHome(container); break;
                case 'dice': initDiceGame(container); break;
                case 'mines': initMinesGame(container); break;
                case 'crash': initCrashGame(container); break;
                case 'slots': initSlotsGame(container); break;
                case 'coinflip': initCoinFlipGame(container); break;
                case 'hilo': initHiloGame(container); break;
                case 'plinko': initPlinkoGame(container); break;
                case 'wheel': initWheelGame(container); break;
                case 'keno': initKenoGame(container); break;
                default: container.innerHTML = `<div class="p-8 text-center text-gray-400">Game under construction...</div>`;
            }
            refreshIcons();
        }

        function toggleSidebar(forceState) {
            sidebarOpen = forceState !== undefined ? forceState : !sidebarOpen;
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebarOpen) {
                sidebar.classList.remove('-translate-x-full');
                if (window.innerWidth < 1024 && overlay) overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                if (overlay) overlay.classList.add('hidden');
            }
        }

        // ==========================================
        // 3. AUTHENTICATION VIEW
        // ==========================================
        function renderLoginView() {
            return `
            <div class="min-h-screen w-full flex flex-col items-center justify-center p-4">

                    <div class="flex flex-col items-center mb-6">
                        <div class="bg-[#0f212e] p-4 rounded-full border border-[#2f4553] mb-4 shadow-[0_0_15px_rgba(0,231,1,0.2)]">
                            <i data-lucide="lock" class="w-8 h-8 text-[#00e701]"></i>
                        </div>
                        <h1 class="text-2xl font-bold text-white tracking-wider">NEXUS<span class="text-gray-400">BET</span></h1>
                        <p class="text-gray-500 text-sm mt-1">Base44 Database Verification</p>
                    </div>

                    <div id="auth-error" class="hidden bg-red-500/20 border border-red-500 text-red-400 p-3 rounded-lg text-sm mb-4 font-bold text-center"></div>

                    <form id="auth-form" class="space-y-4">

                            <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Username</label>
                            <input type="text" id="auth-username" class="w-full bg-[#0f212e] border border-[#2f4553] focus:border-[#00e701] rounded-lg px-4 py-3 text-white outline-none transition-colors" placeholder="Enter username" required />
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Password</label>
                            <input type="password" id="auth-password" class="w-full bg-[#0f212e] border border-[#2f4553] focus:border-[#00e701] rounded-lg px-4 py-3 text-white outline-none transition-colors" placeholder="••••••••" required />
                        </div>
                        <button type="submit" id="auth-submit" class="w-full bg-[#00e701] hover:bg-[#00c701] text-black font-bold py-3 rounded-lg mt-4 transition-colors flex items-center justify-center gap-2">
                            <span id="auth-btn-text">Enter Casino</span>
                            <i data-lucide="arrow-right" class="w-5 h-5"></i>
                        </button>
                    </form>
                    
                    <div class="mt-6 text-center">
                        <button id="auth-toggle-mode" type="button" class="text-gray-400 text-sm hover:text-white transition-colors">No account? Register to DB</button>
                    </div>
                </div>
                <div class="mt-8 text-gray-500 text-sm font-mono opacity-50 cursor-default">NexusBet Vanilla v7.1.26 - Anti-Crash System</div>
            </div>`;
        }

        function bindLoginEvents() {
            let isRegisterMode = false;
            const form = document.getElementById('auth-form');
            const toggleBtn = document.getElementById('auth-toggle-mode');
            const btnText = document.getElementById('auth-btn-text');
            const errorDiv = document.getElementById('auth-error');
            const submitBtn = document.getElementById('auth-submit');

            // Fallback warning se Supabase non si è caricato
            if (!supabase || !supabase.from) {
                errorDiv.innerText = 'WARNING: Supabase CDN Blocked. DB offline.';
                errorDiv.classList.remove('hidden');
            }

            toggleBtn.onclick = () => {
                isRegisterMode = !isRegisterMode;
                btnText.innerText = isRegisterMode ? 'Create Account' : 'Enter Casino';
                toggleBtn.innerText = isRegisterMode ? 'Already have an account? Login here' : 'No account? Register to DB';
                if(supabase) errorDiv.classList.add('hidden');
            };

            form.onsubmit = async (e) => {
                e.preventDefault();
                const username = document.getElementById('auth-username').value;
                const password = document.getElementById('auth-password').value;
                
                if (!supabase || !supabase.from) {
                    errorDiv.innerText = 'API Firewall Blocked: Cannot connect to Supabase.';
                    errorDiv.classList.remove('hidden');
                    return;
                }

                submitBtn.disabled = true;
                btnText.innerText = 'Authenticating...';
                errorDiv.classList.add('hidden');

                try {
                    if (isRegisterMode) {
                        const { data: existing } = await supabase.from('profiles').select('username').eq('username', username).single();
                        if (existing) {
                            errorDiv.innerText = 'Username already taken.';
                            errorDiv.classList.remove('hidden');
                            submitBtn.disabled = false;
                            btnText.innerText = 'Create Account';
                            return;
                        }
                        const { data, error } = await supabase.from('profiles').insert([{ username, password, email: 'EMPTY', Balance: 1000.00 }]).select().single();
                        if (error) throw error;
                        if (data) { currentUser = data; updateBalance(data.Balance || 1000, true); initApp(); }
                    } else {
                        const { data, error } = await supabase.from('profiles').select('*').eq('username', username).eq('password', password).single();
                        if (error || !data) {
                            errorDiv.innerText = 'Invalid credentials. Access denied.';
                            errorDiv.classList.remove('hidden');
                        } else {
                            currentUser = data;
                            updateBalance(data.Balance || 0, true);
                            initApp();
                        }
                    }
                } catch (err) {
                    console.error(err);
                    errorDiv.innerText = 'Database connection error.';
                    errorDiv.classList.remove('hidden');
                }
                submitBtn.disabled = false;
                btnText.innerText = isRegisterMode ? 'Create Account' : 'Enter Casino';
            };
        }

        // ==========================================
        // 4. MAIN LAYOUT
        // ==========================================

                            <i data-lucide="hexagon" class="w-8 h-8 text-[#00e701]"></i>
                            <span class="text-xl font-bold tracking-wider">NEXUS<span class="text-gray-400">BET</span></span>

                    </div>
                    <div class="flex-1 overflow-y-auto py-4 custom-scrollbar">
                        <div class="px-4 mb-2">
                            <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Nexus Originals</h3>

                        </div>
                    </div>
                </div>

                <!-- OVERLAY -->
                <div id="sidebar-overlay" class="${sidebarOpen && window.innerWidth < 1024 ? '' : 'hidden'} fixed inset-0 bg-black/50 z-40 lg:hidden" onclick="toggleSidebar(false)"></div>

                <!-- MAIN AREA -->
                <div class="flex-1 flex flex-col h-screen overflow-hidden bg-[#1a2c38]">
                    <!-- NAVBAR -->
                    <header class="h-16 bg-[#1a2c38] flex items-center justify-between px-4 lg:px-8 border-b border-[#0f212e] shrink-0">
                        <div class="flex items-center gap-4">
                            <button class="lg:hidden text-gray-400 hover:text-white" onclick="toggleSidebar(true)">
                                <i data-lucide="menu" class="w-6 h-6"></i>
                            </button>
                        </div>
                        <div class="flex items-center gap-3 lg:gap-6">
                            <div class="flex items-center bg-[#0f212e] rounded-md p-1 border border-gray-700/50">
                                <div class="px-3 text-sm font-semibold text-white flex items-center gap-2">
                                    <span class="wallet-balance">$ ${balance.toFixed(2)}</span>
                                </div>
                                <button class="bg-[#00e701] hover:bg-[#00c701] text-black text-sm font-bold py-1.5 px-4 rounded transition-colors shadow-[0_0_10px_rgba(0,231,1,0.2)]">Wallet</button>
                            </div>
                            <div class="hidden sm:flex items-center gap-3">
                                <div class="flex items-center gap-2 mr-4 text-sm font-bold text-gray-300">
                                    <i data-lucide="user" class="w-4 h-4 text-[#00e701]"></i> ${currentUser.username}
                                </div>
                                <button id="btn-logout" class="text-gray-400 hover:text-red-500 transition-colors" title="Logout">

                            </div>

                    <!-- CONTENT DYNAMIC -->
                    <main id="main-content" class="flex-1 overflow-y-auto p-4 lg:p-8 custom-scrollbar relative"></main>
                </div>
            </div>`;
        }

        function bindLayoutEvents() {
            document.querySelectorAll('.sidebar-item').forEach(btn => {
                btn.onclick = () => navigate(btn.dataset.tab);
            });
            document.getElementById('btn-logout').onclick = () => {
                currentUser = null;
                initApp();
            };
            window.addEventListener('resize', () => {
                if (window.innerWidth >= 1024 && !sidebarOpen) toggleSidebar(true);
            });
        }

        // ==========================================
        // 5. UTILS & HOME
        // ==========================================
        function renderBetInput(idPrefix) {
            return `
            <div class="space-y-1.5">
                <div class="flex justify-between text-sm"><span class="text-gray-400">Bet Amount</span></div>
                <div class="flex bg-[#1a2c38] rounded border border-[#2f4553] focus-within:border-[#557086]">
                    <div class="pl-3 py-2 flex items-center"><i data-lucide="circle-dollar-sign" class="w-4 h-4 text-yellow-500"></i></div>
                    <input type="number" id="${idPrefix}-amount" value="10" class="w-full bg-transparent border-none outline-none text-white px-2 py-2 text-sm" step="0.01" min="0.01" />
                    <div class="flex">
                        <button id="${idPrefix}-half" class="px-3 hover:bg-[#2f4553] text-gray-400 text-xs font-bold border-l border-[#2f4553]">½</button>
                        <button id="${idPrefix}-double" class="px-3 hover:bg-[#2f4553] text-gray-400 text-xs font-bold border-l border-[#2f4553]">2×</button>
                    </div>
                </div>
            </div>`;
        }

        function bindBetInput(idPrefix, stateObj) {
            const input = document.getElementById(`${idPrefix}-amount`);
            document.getElementById(`${idPrefix}-half`).onclick = () => { input.value = Math.max(0.01, (Number(input.value)/2).toFixed(2)); stateObj.bet = Number(input.value); };
            document.getElementById(`${idPrefix}-double`).onclick = () => { input.value = (Number(input.value)*2).toFixed(2); stateObj.bet = Number(input.value); };
            input.onchange = () => stateObj.bet = Number(input.value);
            return input;
        }

            const games = [
                { id: 'slots', name: 'Nexus Slots', icon: 'crown', color: 'from-purple-600 to-purple-900' },

                { id: 'keno', name: 'Keno', icon: 'layout-grid', color: 'from-fuchsia-500 to-fuchsia-700' },

        // ==========================================

        // ==========================================
        
        // --- DICE ---
        function initDiceGame(container) {
            let state = { bet: 10, chance: 49.5, rolling: false };
            container.innerHTML = `
            <div class="max-w-5xl mx-auto flex flex-col lg:flex-row gap-6 h-[calc(100vh-140px)]">
                <div class="w-full lg:w-80 bg-[#0f212e] rounded-xl p-4 border border-[#2f4553] flex flex-col gap-4">
                    ${renderBetInput('dice')}
                    <div class="bg-[#1a2c38] p-4 rounded border border-[#2f4553] mt-2">
                        <div class="flex justify-between text-sm mb-1 text-gray-400"><span>Potential Profit</span></div>
                        <div id="dice-profit" class="text-[#00e701] font-bold text-lg"></div>
                    </div>
                    <button id="dice-btn" class="w-full mt-auto bg-[#00e701] disabled:bg-gray-600 text-black font-bold text-lg py-4 rounded-lg">Bet</button>
                </div>
                <div class="flex-1 bg-[#0f212e] rounded-xl border border-[#2f4553] flex flex-col items-center justify-center p-8 relative overflow-hidden">
                    <div id="dice-display" class="text-9xl font-black tabular-nums text-white">00.00</div>
                    <div id="dice-msg" class="mt-2 font-bold h-6"></div>
                    <div class="w-full max-w-lg mt-12 relative h-4 bg-[#1a2c38] rounded-full border border-[#2f4553] overflow-hidden">
                        <div id="dice-bar-green" class="absolute top-0 bottom-0 left-0 bg-[#00e701] opacity-40 transition-all"></div>
                        <div id="dice-bar-red" class="absolute top-0 bottom-0 right-0 bg-red-500 opacity-40 transition-all"></div>
                        <div id="dice-marker" class="absolute top-0 bottom-0 w-1 bg-white z-10 shadow-[0_0_10px_white] hidden"></div>
                    </div>
                    <input type="range" id="dice-slider" min="2" max="98" step="0.5" value="49.5" class="w-full max-w-lg mt-4 accent-[#00e701] cursor-pointer" />
                    <div class="mt-8 grid grid-cols-3 gap-4 w-full max-w-lg">
                        <div class="bg-[#1a2c38] rounded p-2 text-center border border-[#2f4553]"><div class="text-gray-400 text-xs mb-1">Multiplier</div><div id="dice-mult" class="text-white font-bold"></div></div>

                        <div class="bg-[#1a2c38] rounded p-2 text-center border border-[#2f4553]"><div class="text-gray-400 text-xs mb-1">Win Chance</div><div id="dice-chance" class="text-white font-bold"></div></div>
                    </div>
                </div>
            </div>`;

            const inputBet = bindBetInput('dice', state);
            const slider = document.getElementById('dice-slider');
            const btn = document.getElementById('dice-btn');
            const ui = {
                profit: document.getElementById('dice-profit'), mult: document.getElementById('dice-mult'), target: document.getElementById('dice-target'),
                chance: document.getElementById('dice-chance'), display: document.getElementById('dice-display'), msg: document.getElementById('dice-msg'),
                barG: document.getElementById('dice-bar-green'), barR: document.getElementById('dice-bar-red'), marker: document.getElementById('dice-marker')
            };

            const updateUI = () => {
                const mult = (99 / state.chance).toFixed(4);
                ui.mult.innerText = `${mult}×`; ui.target.innerText = state.chance.toFixed(2); ui.chance.innerText = `${state.chance}%`;
                ui.profit.innerText = `+$${((state.bet * mult) - state.bet).toFixed(2)}`;
                ui.barG.style.width = `${state.chance}%`; ui.barR.style.width = `${100 - state.chance}%`;
                btn.disabled = state.bet > balance || state.rolling;
            };

            slider.oninput = (e) => { state.chance = Number(e.target.value); updateUI(); };

            const gridEl = document.getElementById('mines-grid'); const msgEl = document.getElementById('mines-msg');

            select.onchange = (e) => state.mines = Number(e.target.value);
            function getMult() { return (1 + (state.revealed * (state.mines * 0.1))).toFixed(2); }

            function renderGrid() {
                gridEl.innerHTML = '';
                for(let i=0; i<25; i++) {
                    const cell = state.grid[i];
                    const btnC = document.createElement('button');
                    let bg = 'bg-[#3d5a6c] hover:bg-[#4a6b80]'; let content = '';
                    if (cell && cell.revealed) {

                        content = `<span class="text-3xl lg:text-4xl drop-shadow-md">${cell.isMine ? '💣' : '💎'}</span>`;

                            msgEl.innerText = "Boom! You lost."; msgEl.className = "absolute top-4 text-red-500 font-bold text-2xl animate-pulse";
                        } else {
                            state.revealed++; btn.innerText = `Cashout $${(state.bet * getMult()).toFixed(2)}`;
                        }
                        renderGrid(); updateBtn();
                    };
                    gridEl.appendChild(btnC);
                }
            }

            function updateBtn() {
                select.disabled = state.playing; document.getElementById('mines-amount').disabled = state.playing;
                if (state.playing) { btn.className = "w-full mt-auto bg-yellow-500 text-black font-bold text-lg py-4 rounded-lg shadow-[0_0_15px_rgba(234,179,8,0.4)]"; btn.innerText = `Cashout $${(state.bet * getMult()).toFixed(2)}`; } 
                else { btn.className = "w-full mt-auto bg-[#00e701] text-black font-bold text-lg py-4 rounded-lg"; btn.innerText = 'Bet'; btn.disabled = state.bet > balance; }
            }

            btn.onclick = () => {

                    updateBalance(state.bet * getMult()); state.playing = false; state.grid.forEach(c => c.revealed = true);
                    msgEl.innerText = "You Won!"; msgEl.className = "absolute top-4 text-[#00e701] font-bold text-2xl animate-bounce";
                } else {
                    if (state.bet > balance) return;
                    updateBalance(-state.bet); state.playing = true; state.revealed = 0; msgEl.className = "hidden";
                    state.grid = Array(25).fill(null).map(() => ({ isMine: false, revealed: false }));
                    let placed = 0;
                    while(placed < state.mines) { let r = Math.floor(Math.random() * 25); if (!state.grid[r].isMine) { state.grid[r].isMine = true; placed++; } }
                }
                renderGrid(); updateBtn();
            };

            state.grid = Array(25).fill(null).map(() => ({ isMine: false, revealed: false }));
            renderGrid(); updateBtn();
        }

        function initCrashGame(container) {
            let state = { bet: 10, playing: false, crashed: false, mult: 1.00 };
            let animReq, startTime, crashPoint;
            container.innerHTML = `
            <div class="max-w-5xl mx-auto flex flex-col lg:flex-row gap-6 h-[calc(100vh-140px)]">

                    <div class="absolute bottom-0 left-0 w-full h-full opacity-30"><svg viewBox="0 0 100 100" preserveAspectRatio="none" class="w-full h-full"><path id="crash-line" d="M0,100 Q10,90 20,80" fill="none" stroke="#00e701" stroke-width="2" /></svg></div>
                    <div class="text-center z-10"><div id="crash-display" class="text-7xl font-black tabular-nums text-[#00e701]">1.00x</div><div id="crash-msg" class="text-red-500 font-bold tracking-widest uppercase mt-2 hidden">Crashed</div></div>
                </div>
            </div>`;

            bindBetInput('crash', state);
            const btn = document.getElementById('crash-btn'); const display = document.getElementById('crash-display');
            const msg = document.getElementById('crash-msg'); const line = document.getElementById('crash-line');

            const updateUI = () => {
                display.innerText = `${state.mult.toFixed(2)}x`;
                if(state.crashed) { display.className = "text-7xl font-black tabular-nums text-red-500"; msg.classList.remove('hidden'); line.setAttribute('stroke', 'red'); btn.className = "w-full mt-auto bg-[#00e701] text-black font-bold text-lg py-4 rounded-lg"; btn.innerText = 'Bet'; } 
                else if(state.playing) { display.className = "text-7xl font-black tabular-nums text-[#00e701]"; msg.classList.add('hidden'); line.setAttribute('stroke', '#00e701'); btn.className = "w-full mt-auto bg-yellow-500 text-black font-bold text-lg py-4 rounded-lg"; btn.innerText = `Cashout $${(state.bet * state.mult).toFixed(2)}`; } 
                else { display.className = "text-7xl font-black tabular-nums text-[#00e701]"; msg.classList.add('hidden'); line.setAttribute('stroke', '#00e701'); }
                let p = Math.min(100, state.mult * 10); line.setAttribute('d', `M0,100 Q${p},${100-p} ${p*2},${100-(p*2)}`);
            };

            const loop = (time) => {
                const elapsed = time - startTime; const m = 1 + (elapsed / 3000) * (elapsed / 2000);
                if (m >= crashPoint) { state.mult = crashPoint; state.playing = false; state.crashed = true; updateUI(); } 
                else { state.mult = m; updateUI(); animReq = requestAnimationFrame(loop); }
            };
            const ghostLoop = (time) => {
                const elapsed = time - startTime; const m = 1 + (elapsed / 3000) * (elapsed / 2000);
                if (m >= crashPoint) { state.mult = crashPoint; state.crashed = true; updateUI(); } 
                else { state.mult = m; updateUI(); animReq = requestAnimationFrame(ghostLoop); }
            };

            btn.onclick = () => {
                if(state.playing) { updateBalance(state.bet * state.mult); state.playing = false; cancelAnimationFrame(animReq); animReq = requestAnimationFrame(ghostLoop); updateUI(); } 
                else {
                    if (state.bet > balance) return;
                    updateBalance(-state.bet); crashPoint = Math.max(1.00, (100 / (100 - (Math.random() * 100))));
                    state.mult = 1.0; state.playing = true; state.crashed = false; startTime = performance.now();
                    animReq = requestAnimationFrame(loop); updateUI();
                }
            };
        }

                    <div id="cf-win" class="absolute top-10 font-bold text-3xl animate-bounce hidden"></div>
                    <div id="cf-coin" class="w-48 h-48 relative coin-inner" style="transform: rotateY(0deg)">
                        <div class="coin-front bg-yellow-400 rounded-full flex items-center justify-center border-8 border-yellow-200"><i data-lucide="star" class="w-20 h-20 text-yellow-100" fill="currentColor"></i></div>
                        <div class="coin-back bg-[#00b701] rounded-full flex items-center justify-center border-8 border-[#00e701]"><i data-lucide="zap" class="w-20 h-20 text-green-100" fill="currentColor"></i></div>
                    </div>
                </div>
            </div>`;

            bindBetInput('cf', state);
            const setC = (c) => { 
                state.choice=c; 
                document.getElementById('cf-h').className = `flex-1 py-3 rounded font-bold border-2 ${c==='heads'?'border-yellow-400 bg-yellow-400/10 text-yellow-400':'border-[#2f4553] text-gray-400'}`;
                document.getElementById('cf-t').className = `flex-1 py-3 rounded font-bold border-2 ${c==='tails'?'border-[#00e701] bg-[#00e701]/10 text-[#00e701]':'border-[#2f4553] text-gray-400'}`;
            };
            document.getElementById('cf-h').onclick = () => !state.flipping && setC('heads');
            document.getElementById('cf-t').onclick = () => !state.flipping && setC('tails');
            
            document.getElementById('cf-btn').onclick = () => {
                if(state.bet > balance || state.flipping) return;
                updateBalance(-state.bet); state.flipping=true;
                const coin = document.getElementById('cf-coin'); const win = document.getElementById('cf-win'); win.classList.add('hidden');
                
                coin.style.transform = `rotateY(1800deg)`;
                setTimeout(()=>{
                    const res = Math.random()>0.5?'heads':'tails';
                    coin.style.transform = `rotateY(${res==='tails'?180:0}deg)`;
                    if(res===state.choice){ updateBalance(state.bet*1.98); win.innerText=`You won $${(state.bet*1.98).toFixed(2)}`; win.className="absolute top-10 font-bold text-3xl animate-bounce text-[#00e701]"; }
                    else { win.innerText="Try again"; win.className="absolute top-10 font-bold text-3xl text-red-500"; }
                    state.flipping=false;
                }, 2000);
            };
            refreshIcons();
        }

        function initKenoGame(container) { container.innerHTML = `<div class="p-8 text-center text-gray-400 flex flex-col items-center"><i data-lucide="layout-grid" class="w-16 h-16 mb-4 text-[#00e701] animate-pulse"></i><h2 class="text-2xl text-white font-bold">Keno Module Loading</h2></div>`; refreshIcons(); }
        function initHiloGame(container) { container.innerHTML = `<div class="p-8 text-center text-gray-400 flex flex-col items-center"><i data-lucide="layers" class="w-16 h-16 mb-4 text-[#00e701] animate-pulse"></i><h2 class="text-2xl text-white font-bold">Hilo Module Loading</h2></div>`; refreshIcons(); }

        // ==========================================
        // 7. BOOTSTRAPPER (SAFE INIT)
        // ==========================================
        window.addEventListener('load', () => {
            console.log("DOM Loaded. Checking Supabase...");
            try {
                if (window.supabase) {
                    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                    console.log("Supabase connected.");
                } else {
                    console.warn("Supabase not found in window object.");
                }
            } catch(e) {
                console.error("Error initializing Supabase", e);
            }
            initApp();
        });

    </script>
</body>
</html>
